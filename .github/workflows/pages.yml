name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  issues:
    types: [opened]     # credit new data-source requests without waiting for a merge
  workflow_dispatch:

permissions:
  contents: write   # commit the regenerated contributors.ttl back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'data-source')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, for contributors.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rdflib && python scripts/validate.py
      - name: Collect contributors (GitHub history, pull requests, data-source issues, Wikidata)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/contributors.py "$RUNNER_TEMP/contributors.json" --turtle fdp/biodiversity-index/contributors.ttl
      - name: Commit contributors.ttl if it changed
        # Keeps the raw.githubusercontent.com copy of the FDP in step with the site.
        # A push made with GITHUB_TOKEN does not trigger another workflow run.
        run: |
          if ! git diff --quiet -- fdp/biodiversity-index/contributors.ttl || [ -n "$(git status --porcelain fdp/biodiversity-index/contributors.ttl)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add fdp/biodiversity-index/contributors.ttl
            git commit -m "Update contributors.ttl"
            git pull --rebase origin main && git push origin HEAD:main || echo "::warning::Could not push contributors.ttl; the site still has the fresh copy."
          fi
      - run: scripts/build-site.sh
      - run: cp "$RUNNER_TEMP/contributors.json" _site/contributors.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

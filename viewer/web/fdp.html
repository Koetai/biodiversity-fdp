<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDP Browser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="header">
  <div class="brand">
    <div class="logo">B</div>
    <div><div class="brand-title">Biodiversity FDP</div><div class="brand-sub" id="repo-label">FDP browser</div></div>
  </div>
  <div class="nav">
    <a href="/">Home</a>
    <a class="active" href="/fdp">FDP browser</a>
    <a href="/editor">Turtle editor</a>
  </div>
</div>

<nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
<main id="view"><div class="loading"><div class="spinner"></div>Loading catalogs…</div></main>

<script>
const $ = id => document.getElementById(id);
const esc = s => s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : null;

const METHOD_LABELS = {
  'web-portal': 'Web portal', 'rest-api': 'REST API', 'sparql-endpoint': 'SPARQL',
  'bulk-download': 'Bulk download', 'cloud-object-storage': 'Cloud bucket',
  'darwin-core-archive': 'Darwin Core Archive', 'rdf-dump': 'RDF dump',
  'source-repository': 'Git repository', 'aggregator-mirror': 'Copy in aggregator',
  'oai-pmh': 'OAI-PMH', 'sql-query': 'SQL query', 'change-feed': 'Change feed'
};

let cfg = null, index = null, catalogs = [], rawCache = {}, methodFilter = null;

async function init() {
  cfg = await fetch('/api/config').then(r => r.json());
  $('repo-label').textContent = cfg.org + '/' + cfg.repo + ' · ' + cfg.branch;
  const folders = await fetch('/api/fdp/folders').then(r => r.json());
  if (folders.error) { $('view').innerHTML = '<div class="card error">Could not list the FDP folder: ' + esc(folders.error) + '</div>'; return; }

  const results = await Promise.all(folders.map(f =>
    fetch('/api/fdp/catalog?folder=' + encodeURIComponent(f)).then(r => r.json()).catch(() => null)));
  for (const c of results) {
    if (!c || c.error) continue;
    if (c.index) index = c; else catalogs.push(c);
  }
  // Order catalogs as the index lists them (rdfs:seeAlso → folder name).
  if (index) {
    const order = index.catalogs.map(x => (x.seeAlso || '').split('/').slice(-2, -1)[0]);
    catalogs.sort((a, b) => rank(order, a.folder) - rank(order, b.folder));
  }
  route();
}
const rank = (order, f) => { const i = order.indexOf(f); return i < 0 ? 999 : i; };

// Hash routing: #/folder/datasetId
window.addEventListener('hashchange', route);
function route() {
  const [, folder, ds] = location.hash.split('/').map(decodeURIComponent);
  methodFilter = null;
  if (folder && ds) showDataset(folder, ds);
  else if (folder) showCatalog(folder);
  else showIndex();
  window.scrollTo(0, 0);
}
const go = (...parts) => { location.hash = '#/' + parts.map(encodeURIComponent).join('/'); };

function crumbs(parts) {
  let html = '<button data-go="">Index</button>';
  for (const p of parts) {
    html += '<span>›</span>';
    html += p.go == null ? '<span class="current">' + esc(p.label) + '</span>'
                         : '<button data-go="' + esc(p.go) + '">' + esc(p.label) + '</button>';
  }
  $('crumbs').innerHTML = html;
  $('crumbs').querySelectorAll('button').forEach(b => b.onclick = () => { location.hash = b.dataset.go ? '#/' + b.dataset.go : ''; });
}

// ── Level 1: index ───────────────────────────────────────────────────────────
function showIndex() {
  crumbs([]);
  let html = '<h1>' + esc(index ? index.title : 'FDP index') + '</h1>';
  if (index && index.description) html += '<p class="lead">' + esc(index.description) + '</p>';
  html += '<div class="grid">';
  for (const c of catalogs) {
    const n = (c.datasets || []).length;
    const d = (c.datasets || []).reduce((s, x) => s + (x.distributions || []).length, 0);
    html += `<div class="card clickable" tabindex="0" data-folder="${esc(c.folder)}">
      <div class="cat-title">${esc(c.title || c.folder)}</div>
      <div class="cat-desc">${esc(c.description || '')}</div>
      <div class="cat-meta">${n} dataset${n !== 1 ? 's' : ''} · ${d} distribution${d !== 1 ? 's' : ''}</div>
    </div>`;
  }
  html += '</div>';
  if (index) html += turtleTabs(index.folder);
  $('view').innerHTML = html;
  $('view').querySelectorAll('[data-folder]').forEach(el => {
    el.onclick = () => go(el.dataset.folder);
    el.onkeydown = e => { if (e.key === 'Enter') go(el.dataset.folder); };
  });
  if (index) wireTabs(index.folder);
}

// ── Level 2: catalog → datasets ─────────────────────────────────────────────
function showCatalog(folder) {
  const c = catalogs.find(x => x.folder === folder);
  if (!c) { $('view').innerHTML = '<div class="card">Unknown catalog.</div>'; return; }
  crumbs([{ label: c.title || folder }]);
  let html = '<h1>' + esc(c.title || folder) + '</h1><p class="lead">' + esc(c.description || '') + '</p>';
  const links = [];
  if (safeUrl(c.landingPage)) links.push('<a href="' + esc(c.landingPage) + '" target="_blank" rel="noopener">Landing page ↗</a>');
  if (safeUrl(c.license)) links.push('<a href="' + esc(c.license) + '" target="_blank" rel="noopener">Licence ↗</a>');
  if (links.length) html += '<p class="muted" style="margin-top:-10px;margin-bottom:18px">' + links.join(' · ') + '</p>';

  html += '<div class="section-title">Datasets</div>';
  for (const ds of c.datasets || []) {
    const n = (ds.distributions || []).length;
    html += `<div class="card clickable ds-row" tabindex="0" data-ds="${esc(ds.id)}">
      <div class="ds-version">${esc(ds.version || ds.id)}</div>
      <div class="ds-info">
        <div class="ds-title">${esc(ds.title || ds.id)}</div>
        <div class="muted">${esc(ds.description || '')}</div>
      </div>
      <span class="chip">${n} way${n !== 1 ? 's' : ''} to get it</span>
    </div>`;
  }
  html += turtleTabs(folder);
  $('view').innerHTML = html;
  $('view').querySelectorAll('[data-ds]').forEach(el => {
    el.onclick = () => go(folder, el.dataset.ds);
    el.onkeydown = e => { if (e.key === 'Enter') go(folder, el.dataset.ds); };
  });
  wireTabs(folder);
}

// ── Level 3: dataset → distributions ────────────────────────────────────────
function showDataset(folder, dsId) {
  const c = catalogs.find(x => x.folder === folder);
  const ds = c && (c.datasets || []).find(d => d.id === dsId);
  if (!ds) { $('view').innerHTML = '<div class="card">Unknown dataset.</div>'; return; }
  crumbs([{ label: c.title || folder, go: encodeURIComponent(folder) }, { label: ds.version || ds.id }]);

  const meta = [];
  if (ds.issued) meta.push('Issued ' + esc(ds.issued));
  if (ds.modified) meta.push('Modified ' + esc(ds.modified));
  if (ds.identifier) meta.push(safeUrl(ds.identifier) ? '<a href="' + esc(ds.identifier) + '" target="_blank" rel="noopener">' + esc(ds.identifier) + '</a>' : esc(ds.identifier));
  if (safeUrl(ds.license)) meta.push('<a href="' + esc(ds.license) + '" target="_blank" rel="noopener">Licence ↗</a>');

  const dists = ds.distributions || [];
  const methods = [...new Set(dists.map(d => d.accessMethod).filter(Boolean))];

  let html = '<h1>' + esc(ds.title || ds.id) + '</h1><p class="lead">' + esc(ds.description || '') +
             (meta.length ? '<br><span class="muted">' + meta.join(' · ') + '</span>' : '') + '</p>';
  html += '<div class="section-title">Ways to get it (' + dists.length + ')</div>';
  html += '<div class="filters" id="filters"><button class="on" data-m="">All</button>' +
          methods.map(m => '<button data-m="' + esc(m) + '">' + esc(METHOD_LABELS[m] || m) + '</button>').join('') + '</div>';
  html += '<div class="grid" id="dists"></div>';
  $('view').innerHTML = html;

  const render = () => {
    $('dists').innerHTML = dists.filter(d => !methodFilter || d.accessMethod === methodFilter).map(distCard).join('');
  };
  $('filters').querySelectorAll('button').forEach(b => b.onclick = () => {
    methodFilter = b.dataset.m || null;
    $('filters').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
  render();
}

function distCard(d) {
  const how = (d.description || '').replace(/^How to get it:\s*/i, '');
  const fmt = [d.mediaType, d.format].filter(Boolean).filter((v, i, a) => a.indexOf(v) === i).join(' · ');
  const links = [];
  if (safeUrl(d.accessURL)) links.push('<a href="' + esc(d.accessURL) + '" target="_blank" rel="noopener">Open ↗</a>');
  if (safeUrl(d.downloadURL)) links.push('<a href="' + esc(d.downloadURL) + '" target="_blank" rel="noopener">Download ↓</a>');
  const svcs = (d.services || []).map(s => s.endpointURL
      ? '<div class="svc mono">' + esc(s.title || 'Service') + '<br>' + esc(s.endpointURL) + '</div>'
      : '<div class="svc mono">Service described in ' + esc(s.ref.split('/').slice(-2, -1)[0]) + '</div>').join('');
  return `<div class="card dist">
    <div class="dist-head"><div class="dist-title">${esc(d.title || d.id)}</div>
      ${d.accessMethod ? '<span class="chip">' + esc(METHOD_LABELS[d.accessMethod] || d.accessMethod) + '</span>' : ''}</div>
    ${fmt ? '<div class="muted mono" style="font-size:12px">' + esc(fmt) + '</div>' : ''}
    ${how ? '<div class="dist-how">' + esc(how) + '</div>' : ''}
    ${svcs}
    <div class="dist-links">${links.join('')}</div>
  </div>`;
}

// ── Turtle source tab ───────────────────────────────────────────────────────
function turtleTabs(folder) {
  return `<div class="tabs"><button class="on" data-tab="hide">Summary</button><button data-tab="raw">Turtle source</button></div>
          <div id="raw-box" hidden><pre class="ttl">Loading…</pre></div>`;
}
function wireTabs(folder) {
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = async () => {
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    $('raw-box').hidden = b.dataset.tab !== 'raw';
    if (b.dataset.tab === 'raw') {
      if (!rawCache[folder]) {
        const r = await fetch('/api/github/raw?path=' + encodeURIComponent(cfg.fdpDir + '/' + folder + '/catalog.ttl')).then(r => r.json());
        rawCache[folder] = r.content || ('Could not load: ' + (r.error || 'unknown error'));
      }
      $('raw-box').innerHTML = '<pre class="ttl">' + esc(rawCache[folder]) + '</pre>';
    }
  });
}

init().catch(e => { $('view').innerHTML = '<div class="card error">' + esc(e.message) + '</div>'; });
</script>
</body>
</html>
